services:
  postgres:
    image: postgres:16-alpine
    container_name: eventlog-postgres
    environment:
      POSTGRES_DB: eventlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventlog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventlog-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/eventlog
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"
    volumes:
      - ./charts:/app/charts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventlog-network
    restart: on-failure

networks:
  eventlog-network:
    driver: bridge

volumes:
  postgres_data:
